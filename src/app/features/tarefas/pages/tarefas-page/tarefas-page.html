<h1>Tarefas</h1>

<app-tarefa-form [enviando]="salvando()" [erro]="erroFormulario()" (criar)="criar($event)" />

<section class="secao" aria-labelledby="titulo-lista">
  <h2 id="titulo-lista">Suas tarefas ({{ pendentes() }} pendentes)</h2>

  @if (carregando()) {
    <p>Carregando tarefas…</p>
  } @else if (erroCarregamento(); as mensagem) {
    <p class="texto-erro">{{ mensagem }}</p>
    <button type="button" (click)="carregar()">Tentar de novo</button>
  } @else {
    <app-tarefa-lista [tarefas]="tarefas()" (concluir)="concluir($event)" />
  }
</section>
