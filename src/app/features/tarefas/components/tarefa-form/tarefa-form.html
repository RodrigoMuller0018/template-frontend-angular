<form class="form" novalidate [formGroup]="form" (ngSubmit)="enviar()">
  <label class="form__rotulo" for="titulo">Nova tarefa</label>
  <p id="titulo-ajuda" class="form__ajuda">
    Usamos o título só para listar suas tarefas. Até {{ maximo }} caracteres.
  </p>
  <div class="form__linha">
    <input
      id="titulo"
      type="text"
      autocomplete="off"
      formControlName="titulo"
      [attr.aria-invalid]="mensagemErro() ? true : null"
      [attr.aria-describedby]="descritoPor()"
    />
    <button type="submit" [disabled]="enviando()">Adicionar</button>
  </div>
  @if (mensagemErro(); as mensagem) {
    <p id="titulo-erro" class="form__erro">{{ mensagem }}</p>
  }
</form>
